<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App Install Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14171c;--muted:#6b7280;--line:#e5e7eb;--brand:#4f46e5;--brand-soft:#eef2ff;--ok:#16a34a;--bad:#dc2626;--bar:#6366f1;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--text:#e8eaed;--muted:#9aa3af;--line:#2a303a;--brand:#818cf8;--brand-soft:#1e2140;--bar:#818cf8;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{display:flex;min-height:100vh}
.side{width:236px;flex:0 0 236px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
.brand svg{color:var(--brand);flex:0 0 auto}
.brand .cbt{margin-left:auto;background:none;border:1px solid var(--line);border-radius:7px;padding:4px 6px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.brand .cbt:hover{color:var(--text);background:var(--bg)}
.side nav{padding:10px;display:grid;gap:2px;flex:1;align-content:start}
.side nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
.side nav a:hover{background:var(--bg);color:var(--text)}
.side nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.side nav a svg{flex:0 0 auto}
.side .grp{padding:14px 12px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.foot{padding:12px;border-top:1px solid var(--line);display:grid;gap:8px}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.av{width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:0 0 auto}
.who b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{font-size:11px;color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:none;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.burger{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer;color:var(--text);display:grid}
main{padding:20px;max-width:1600px;margin:0;width:100%}
@media(min-width:1700px){main{padding:24px 32px}}
@media(max-width:900px){
 .side{position:fixed;inset:0 auto 0 0;z-index:50;transform:translateX(-100%);transition:transform .18s;box-shadow:0 0 40px rgba(0,0,0,.25)}
 .side.open{transform:none}
 .top{display:flex}
 main{padding:14px}
 #scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:45}
}
@media(min-width:901px){
 .app.collapsed .side{display:none}
 .app.collapsed .top{display:flex}
}
#scrim{display:none}
#scrim.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:15px}
.card .sub{margin:-6px 0 12px;color:var(--muted);font-size:13px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.grid4 .card{margin:0}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:28px;font-weight:700;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.up{color:var(--ok)}.down{color:var(--bad)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;align-items:stretch}
.cols .card{margin:0}
.cols>.card{display:flex;flex-direction:column}
.cols>.card .hblist,.cols>.card .tablewrap{flex:1;min-height:0}
.cols>.card>.pager{margin-top:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px}
input,select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;min-width:0}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:600;text-decoration:none;display:inline-grid;place-items:center}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line);font-weight:500}
.btn.sm{padding:4px 10px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--card);color:var(--muted);border:0;padding:7px 12px;cursor:pointer;font:inherit}
.seg button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px;position:sticky;top:0;background:var(--card)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--brand-soft)}
.tablewrap{overflow:auto;max-height:70vh}
.num{text-align:right;font-variant-numeric:tabular-nums}
td.c{text-align:center;color:var(--muted)}
.heat{color:var(--text);font-weight:600}
.hb{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-bottom:10px}
.hb .t{height:6px;background:var(--line);border-radius:3px;grid-column:1/3;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--bar);border-radius:3px}
td .t{height:6px;background:var(--line);border-radius:3px;min-width:70px;overflow:hidden}
td .t i{display:block;height:100%;background:var(--bar);border-radius:3px}
tr.sel td{background:var(--brand-soft)}
tr.sel td b{color:var(--brand)}
table.matrix{width:100%}
table.matrix th,table.matrix td{padding:8px 14px}
table.matrix .num{text-align:center}
table.matrix td:first-child,table.matrix th:first-child{min-width:170px}
table.matrix tfoot td{border-bottom:0;border-top:2px solid var(--line);position:sticky;bottom:0;background:var(--card)}
table.brk th:last-child,table.brk td:last-child{width:52%}
table.brk td:first-child{padding-right:28px}
table.brk td:last-child{padding-left:14px}
.appcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.appcard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.appcard:hover{border-color:var(--brand)}
.appcard .meta{min-width:0;flex:1}
.appcard .an{font-weight:600;line-height:1.25}
.appcard .ap{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appcard .num{font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto}
.appcard:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.aic{position:relative;width:48px;height:48px;border-radius:12px;overflow:hidden;background:var(--brand-soft);flex:0 0 auto;display:grid;place-items:center;color:var(--brand);font-weight:700;font-size:20px}
.aic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.aic.sm{width:34px;height:34px;border-radius:9px;font-size:15px}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.chip{display:inline-block;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:1px 9px;font-size:12px;margin:2px 4px 2px 0}
code,pre{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;margin:0}
.key{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;cursor:pointer}
svg text.ax{fill:var(--muted);font-size:10px}
svg line.grid{stroke:var(--line);stroke-width:1}
svg rect.b{fill:var(--bar)}svg rect.b:hover{opacity:.7}
#tip{position:fixed;pointer-events:none;background:#111827;color:#fff;border-radius:6px;padding:4px 8px;font-size:12px;display:none;z-index:99}
.auth{max-width:360px;margin:12vh auto;padding:0 16px}
.auth .card{padding:22px}
.auth form{display:grid;gap:10px}
.auth h1{font-size:20px;margin:0 0 4px}
.msg{color:var(--bad);min-height:18px;font-size:13px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);padding:20px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 12px}
.checks{display:grid;gap:6px;max-height:220px;overflow:auto;margin:8px 0 12px;border:1px solid var(--line);border-radius:8px;padding:8px}
.checks label{display:flex;gap:8px;align-items:center;cursor:pointer}
.form-grid{display:grid;gap:10px}
/* ===== styled system dialog (replaces native alert/confirm) ===== */
#sysdlg{border:0;padding:0;background:transparent;overflow:visible;width:min(420px,92vw);max-width:92vw}
#sysdlg::backdrop{background:rgba(6,8,12,.55);backdrop-filter:blur(3px)}
.sysbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 22px 20px;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:syspop .16s ease-out}
@keyframes syspop{from{transform:translateY(8px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.sysbox .sic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px}
.sysbox .sic svg{width:26px;height:26px}
.sysbox.info .sic{background:var(--brand-soft);color:var(--brand)}
.sysbox.warn .sic{background:color-mix(in srgb,#d97706 16%,transparent);color:#d97706}
.sysbox.danger .sic{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.sysbox h3{margin:0 0 6px;text-align:center;font-size:16px}
.sysbox p{margin:0 0 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.55;word-break:break-word}
.sysbox .sacts{display:flex;gap:10px}
.sysbox .sacts .btn{flex:1;padding:9px 14px}
.btn.solid-danger{background:var(--bad);color:#fff;border:0;font-weight:600}
.btn.solid-danger:hover{filter:brightness(.94)}
/* ===== manual icon picker (URL paste + drag-and-drop) ===== */
.iconpick{display:flex;gap:12px;align-items:flex-start;margin:12px 0 4px}
.iprev{width:64px;height:64px;border-radius:14px;overflow:hidden;flex:0 0 auto;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:26px;border:1px solid var(--line)}
.iprev img{width:100%;height:100%;object-fit:cover}
.ipfields{flex:1;min-width:0;display:grid;gap:8px}
.idrop{border:1.5px dashed var(--line);border-radius:10px;padding:12px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;transition:border-color .15s,background .15s}
.idrop:hover,.idrop.over{border-color:var(--brand);background:var(--brand-soft);color:var(--text)}
.idrop b{color:var(--brand);font-weight:600}
.iconpick input[type=text]{width:100%}
/* ===== custom dropdown (replaces native <select>) ===== */
.csel{position:relative;display:inline-block}
.csel-btn{display:inline-flex;align-items:center;gap:8px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer;max-width:300px;width:100%}
.csel-btn:hover{border-color:var(--brand)}
.csel.open .csel-btn{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.csel-lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;text-align:left}
.csel-chev{display:inline-flex;color:var(--muted);flex:0 0 auto;transition:transform .15s}
.csel-chev svg{width:15px;height:15px}
.csel.open .csel-chev{transform:rotate(180deg)}
.csel-panel{position:absolute;z-index:60;top:calc(100% + 6px);left:0;min-width:100%;width:max-content;max-width:min(420px,calc(100vw - 24px));max-height:280px;overflow-x:hidden;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:4px}
.csel-opt{padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.csel-opt:hover{background:var(--brand-soft)}
.csel-opt.on{background:var(--brand);color:#fff}
.csel-opt.on .muted{color:rgba(255,255,255,.75)}
.csel-empty{padding:8px 10px;color:var(--muted);font-size:13px}
.loading{opacity:.5;pointer-events:none}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 11px;cursor:pointer;font:inherit;font-size:13px}
.tabs button.on{background:var(--brand-soft);color:var(--brand);border-color:transparent;font-weight:600}
.pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
@media(prefers-reduced-motion:no-preference){.side{transition:transform .18s}}
/* ===== DateRangePicker (ported from the reference dashboard; themed with our CSS vars) ===== */
:root{--surface:var(--card);--surface-2:var(--bg);--border:var(--line);--border-strong:var(--line);--text-2:var(--muted);--text-3:var(--muted);--hover:var(--brand-soft);--accent:var(--brand);--accent-hover:var(--brand);--accent-text:#fff;--accent-soft:var(--brand-soft);--shadow-lg:0 14px 40px rgba(0,0,0,.22)}
.drp{font-family:inherit;font-size:13px;color:var(--text);display:inline-flex;gap:10px;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg)}
.drp *,.drp *::before,.drp *::after{box-sizing:border-box}
.drp-presets{display:flex;flex-direction:column;gap:4px;width:132px;flex-shrink:0}
.drp-preset{text-align:left;font:inherit;font-size:13px;color:var(--text-2);background:transparent;border:1px solid transparent;border-radius:7px;padding:6px 10px;cursor:pointer;transition:background .15s,color .15s}
.drp-preset:hover{background:var(--hover);color:var(--text)}
.drp-preset.active{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.drp-main{display:flex;flex-direction:column}
.drp-panels{display:flex;gap:12px}
.drp-side{width:236px}
.drp-box{border:1px solid var(--border);border-radius:8px;background:var(--surface-2)}
.drp-box-title{text-align:center;font-weight:600;font-size:12px;color:var(--text-2);margin:5px 0}
.drp-input-group{display:flex;height:32px;border:1px solid var(--border-strong);border-radius:7px;overflow:hidden;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.drp-input-group:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.drp-input-addon{width:34px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border-right:1px solid var(--border);color:var(--text-3)}
.drp-input-addon svg{width:15px;height:15px}
.drp-input{flex:1;min-width:0;border:0;outline:none;padding:0 10px;font:inherit;font-size:13px;color:var(--text);background:transparent}
.drp-select{font:inherit;font-size:12px;color:var(--text);padding:1px 3px;background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;cursor:pointer}
.drp-cal{margin-top:8px}
.drp-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.drp-cal-selects{display:flex;gap:3px}
.drp-month{width:92px}.drp-year{width:58px}
.drp-nav{width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:none;border:0;border-radius:6px;color:var(--text-2);cursor:pointer}
.drp-nav svg{width:12px;height:12px}
.drp-nav:hover:not(:disabled){background:var(--hover);color:var(--text)}
.drp-nav:disabled{opacity:.3;cursor:default}
.drp-grid{width:100%;border-collapse:collapse;table-layout:fixed}
.drp-grid th{height:24px;font-size:11px;font-weight:500;color:var(--text-3);text-align:center}
.drp-grid td{height:28px;text-align:center;font-size:12.5px;border-radius:6px;cursor:pointer;user-select:none;color:var(--text)}
.drp-grid td:hover{background:var(--hover)}
.drp-grid td.off{color:var(--text-3);opacity:.4;cursor:default;background:none}
.drp-grid td.disabled{color:var(--text-3);opacity:.3;cursor:not-allowed;background:none}
.drp-grid td.in-range{background:var(--accent-soft);border-radius:0}
.drp-grid td.active,.drp-grid td.active:hover{background:var(--accent);color:var(--accent-text);border-radius:6px}
.drp-status{height:20px;margin-top:2px;text-align:center;font-size:12px;line-height:20px;color:var(--text-2)}
.drp-dot{display:inline-block;width:9px;height:9px;margin-left:2px;border-radius:50%;background:var(--ok);vertical-align:0}
.drp-footer{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:6px}
.drp-maxdate{font-size:11px;color:var(--text-3);margin-right:2px}
.drp-btn{font:inherit;font-size:13px;padding:5px 12px;border:1px solid;border-radius:7px;cursor:pointer;transition:background .15s,border-color .15s}
.drp-apply{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.drp-apply:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.drp-cancel{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.drp-cancel:hover{background:var(--hover)}
.drp-wrap{position:relative;display:inline-flex}
.drp-toggle{display:inline-flex;align-items:center;gap:6px}
.drp-toggle svg{width:14px;height:14px}
.drp-panel{position:absolute;z-index:60;margin-top:6px;left:0}
@media(max-width:900px){.drp{flex-direction:column;width:100%;max-width:320px}.drp-presets{flex-direction:row;flex-wrap:wrap;width:100%}.drp-panels{flex-direction:column}.drp-side{width:100%}.drp-footer{flex-wrap:wrap}}
</style>
</head>
<body>
<div id="root"></div>
<div id="tip"></div>
<div id="scrim"></div>
<dialog id="modal"></dialog>
<dialog id="sysdlg"></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString();
const root = $("#root");

const ICON = {
  dash: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  globe: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 010 18M12 3a15 15 0 000 18"/></svg>',
  list: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  apps: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6v6H9z"/></svg>',
  users: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0112 0M16 5.6a3.2 3.2 0 010 5.8M18 20a5.5 5.5 0 00-2-4"/></svg>',
  logo: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><circle cx="12" cy="19" r="2"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',

  collapse: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',

// orphaned node would otherwise look like an outside click and wrongly close the panel
document.addEventListener("click", (e) => { const t = e.target; if (t && t.isConnected && !t.closest(".drp-wrap")) closeAllDrp(); });
document.addEventListener("click", (e) => { const t = e.target; if (t && t.isConnected && !t.closest(".csel")) closeAllCsel(); });
// mount a calendar button + dropdown panel that edits `range` ({from,to}) and calls onApply when a range is chosen
function rangeControl(mount, range, onApply, opts = {}) {
  mount.innerHTML = "";
  const wrap = document.createElement("span"); wrap.className = "drp-wrap";
  const btn = document.createElement("button"); btn.type = "button"; btn.className = "btn ghost sm drp-toggle";
  const panel = document.createElement("div"); panel.className = "drp-panel"; panel.hidden = true;
  const paint = () => { btn.innerHTML = `${ICON.cal}<span>${range.from && range.to ? dLab(range.from) + " \u2192 " + dLab(range.to) : (opts.emptyLabel || "Select dates")}</span>`; };
  paint();
  let dp = null;
  // keep the panel fully inside the viewport (prevents a horizontal page scrollbar)
  const positionDrp = () => {
    if (panel.hidden) return;
    panel.style.left = "0px";
    const w = panel.offsetWidth || panel.getBoundingClientRect().width;
    const wr = wrap.getBoundingClientRect();
    let left = 0;
    if (wr.left + w > window.innerWidth - 8) left = window.innerWidth - 8 - wr.left - w;
    if (wr.left + left < 8) left = 8 - wr.left;
    panel.style.left = left + "px";
  };
  btn.onclick = (e) => { e.stopPropagation(); const willOpen = panel.hidden; closeAllDrp(); panel.hidden = !willOpen; if (panel.hidden) return;
    if (!dp) dp = new DateRangePicker(panel, { format: "YYYY-MM-DD", applyOnPreset: true, onApply: (x) => { range.from = x.from; range.to = x.to; paint(); onApply(x); panel.hidden = true; }, onCancel: () => { panel.hidden = true; } });
    if (range.from && range.to) dp.setRange(range.from, range.to);
    positionDrp();
  };
  window.addEventListener("resize", positionDrp);
  wrap.append(btn, panel); mount.appendChild(wrap);
}
const flag = (cc) => (/^[A-Z]{2}$/.test(cc || "") && cc !== "XX" ? String.fromCodePoint(...[...cc].map((c) => 127397 + c.charCodeAt(0))) : "\u{1F310}");
const cName = (cc) => { try { return new Intl.DisplayNames(["en"], { type: "region" }).of(cc) || cc; } catch { return cc; } };
const cap = (s) => (s ? s[0].toUpperCase() + s.slice(1) : "Unknown");

const SYS_ICONS = {

  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 21 19H3z"/><path d="M12 10v4M12 17h.01"/></svg>',
  danger: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',

function sysDialog({ title, message, type = "info", confirmText, cancelText }) {
  return new Promise((resolve) => {
    const d = $("#sysdlg");
    const isConfirm = !!cancelText;
    d.innerHTML = `<div class="sysbox ${type}"><div class="sic">${SYS_ICONS[type] || SYS_ICONS.info}</div>
      <h3>${esc(title)}</h3><p>${esc(message)}</p>
      <div class="sacts">${isConfirm ? `<button class="btn ghost" id="sysno">${esc(cancelText)}</button>` : ""}
      <button class="btn ${type === "danger" ? "solid-danger" : ""}" id="sysyes">${esc(confirmText || "OK")}</button></div></div>`;
    const done = (v) => { d.close(); resolve(v); };
    $("#sysyes", d).onclick = () => done(true);
    const no = $("#sysno", d); if (no) no.onclick = () => done(false);
    d.oncancel = (e) => { e.preventDefault(); done(isConfirm ? false : true); };
    d.onclick = (e) => { if (e.target === d) done(isConfirm ? false : true); }; // click backdrop to dismiss
    d.showModal();
    (no ? no : $("#sysyes", d)).focus();
  });
}

/* downscale a dropped / selected image into a small square data-URL (keeps it well under D1's row size) */
function fileToIconDataUrl(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error("Not an image file"));
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 256, scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        let out = c.toDataURL("image/webp", 0.9);
        if (!/^data:image\/webp/.test(out)) out = c.toDataURL("image/png");
        resolve(out);
      };
      img.onerror = () => reject(new Error("Could not read that image"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Could not read that file"));
    reader.readAsDataURL(file);
  });
}
/* edit an existing app's name + package name + icon (auto-fetch, paste a URL, or drag-and-drop an image) */
function editApp(id) {
  const app = state.apps.find((a) => String(a.id) === String(id)) || {};
  let icon = app.icon_url || "";
  let iconDirty = false;
  modal(`<h3>Edit app</h3><form id="ef"><div class="form-grid">
    <input name="name" value="${esc(app.name)}" placeholder="App name" required maxlength="60">
    <input name="package_name" value="${esc(app.package_name || "")}" placeholder="Package / bundle id (e.g. com.x.mygame)" maxlength="100">
    </div><p class="muted" style="margin:8px 0 0;font-size:12px">Change the package name and the icon is auto-fetched from the Play Store / App Store. If it isn't found, paste the icon URL or drop an image below.</p>
    <div class="iconpick">
      <div class="iprev" id="iprev"></div>
      <div class="ipfields">
        <div class="idrop" id="idrop">Drag an icon image here, or <b>browse</b><input type="file" id="ifile" accept="image/*" hidden></div>
        <input type="text" id="iurl" placeholder="...or paste an image URL (https://...)" value="${esc(/^https?:/i.test(icon) ? icon : "")}">
        <button type="button" class="btn ghost sm" id="iclear">Remove icon</button>
      </div>
    </div>
    <div class="msg" id="em"></div>
    <div class="row" style="margin-top:10px"><button class="btn">Save</button><button type="button" class="btn ghost" data-close>Cancel</button></div></form>`, (d) => {
    const prev = () => { $("#iprev", d).innerHTML = icon ? `<img src="${esc(icon)}" onerror="this.remove()">` : esc((app.name || "?").charAt(0).toUpperCase()); };
    const setIcon = (v) => { icon = v; iconDirty = true; prev(); const u = $("#iurl", d); if (u) u.value = /^https?:/i.test(v) ? v : (v ? "(dropped image)" : ""); };
    prev();
    const drop = $("#idrop", d), file = $("#ifile", d);
    const handle = async (f) => { try { setIcon(await fileToIconDataUrl(f)); } catch (er) { $("#em", d).textContent = er.message; } };
    file.onclick = (e) => e.stopPropagation();
    drop.onclick = () => file.click();
    file.onchange = () => file.files[0] && handle(file.files[0]);
    drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) handle(f); };
    $("#iurl", d).onchange = (e) => { const v = e.target.value.trim(); if (v && v !== "(dropped image)") setIcon(v); };
    $("#iclear", d).onclick = () => setIcon("");
    $("#ef", d).onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button.btn");
      btn.disabled = true; btn.textContent = "Saving…";
      try {
        const fd = Object.fromEntries(new FormData(e.target));
        const body = { name: fd.name, package_name: fd.package_name };
        if (iconDirty) body.icon_url = icon; // only send when the user actually touched the icon
        const r = await api(`/api/apps/${id}`, { method: "PUT", body });
        $("#modal").close();
        viewApps();
        if (!iconDirty && fd.package_name && !r.icon_url) setTimeout(() => uiAlert("Saved, but this package name was not found on the Play Store or App Store - no icon was fetched. Open Edit again to paste an icon URL or drop an image.", { title: "Icon not found", type: "warn" }), 200);
      } catch (er) { $("#em", d).textContent = er.message; btn.disabled = false; btn.textContent = "Save"; }
    };
  });
}

function drawAppCards() {

  const list = q
    ? state.apps.filter((a) => (a.name || "").toLowerCase().includes(q) || (a.package_name || "").toLowerCase().includes(q))

  if (!list.length) { box.innerHTML = `<div class="card empty" style="grid-column:1/-1">No apps match &ldquo;<b>${esc(state.appSearch.trim())}</b>&rdquo;.</div>`; return; }

    ? `<div class="num" style="text-align:right"><div>${fmt(a.period)}</div><div class="muted" style="font-size:11px;font-weight:500">of ${fmt(a.total)} total</div></div>`
    : `<div class="num">${fmt(a.total)}</div>`;

}

async function loadDetail() {

  if (!app) { box.innerHTML = ""; return; }
  box.classList.add("loading");

  try {

function renderDetail(app, d) {
  const nd = spanDays(state.range.from, state.range.to) || state.days;
  const kpi = (l, v, s) => `<div class="card kpi"><div class="l">${l}</div><div class="v">${fmt(v)}</div><div class="s">${s || "&nbsp;"}</div></div>`;
  const row = (arr, labelFn) => arr.length
    ? arr.map((r) => `<tr><td>${labelFn(r)}</td><td class="num">${fmt(r.c)}</td>
        <td class="num muted">${d.period ? Math.round((r.c / d.period) * 100) : 0}%</td>
        <td><div class="t"><i style="width:${(r.c / arr[0].c) * 100}%"></i></div></td></tr>`).join("")
    : `<tr><td colspan="4" class="muted">No data in this range</td></tr>`;
  const tbl = (title, arr, labelFn) => `<div class="card"><h2>${title}</h2><div class="tablewrap"><table class="brk">
      <thead><tr><th>${title}</th><th class="num">Installs</th><th class="num">Share</th><th></th></tr></thead><tbody data-page="10">${row(arr, labelFn)}</tbody></table></div><div class="pager"></div></div>`;

  let change = '<span class="muted">&mdash;</span>';
  if (d.prev > 0) {
    const p = Math.round(((d.period - d.prev) / d.prev) * 100);
    change = `<span class="${p >= 0 ? "up" : "down"}">${p >= 0 ? "▲" : "▼"} ${Math.abs(p)}%</span> <span class="muted">vs prev ${nd}d</span>`;
  } else if (d.period > 0) change = '<span class="up">▲ new</span>';

  return `<div class="toolbar" style="justify-content:space-between">
      <div class="row" style="gap:12px">${appIcon(app)}
        <div><h2 style="margin:0">${esc(app.name)}</h2><span class="muted">${esc(app.package_name || "no package set")}</span></div></div>
      <div class="row" id="dr"></div></div>
    <div class="grid4">${kpi("Total installs", app.total)}${kpi("Today", d.today)}${kpi(`Last ${nd} days`, d.period, change)}</div>
    <div class="cols" style="margin-bottom:16px">
      ${tbl(`Country (${d.country.length})`, d.country, (r) => `${flag(r.k)} ${esc(cName(r.k))} <span class="muted">${esc(r.k)}</span>`)}</div>
    <div class="card"><h2>Installs in selected range <span class="muted" style="font-weight:400;font-size:13px">(${fmt(d.recent.length)})</span></h2><div class="tablewrap"><table>
      <thead><tr><th>Installed (IST)</th><th>Device</th><th>Country</th><th class="num">Installs</th></tr></thead><tbody data-page="10">
      ${d.recent.length ? d.recent.map((r) => `<tr><td>${esc(r.t.slice(0, 16).replace("T", " "))}</td>
      <td><code>${esc(r.device_id || "")}</code></td>
      <td>${flag(r.country)} ${esc(cName(r.country))}</td>
      <td class="num"><b>${fmt(r.install_count || 1)}</b></td></tr>`).join("")
        : '<tr><td colspan="4" class="muted">No installs yet</td></tr>'}</tbody></table></div><div class="pager"></div></div>`;
}

    <p class="muted" style="margin:10px 0 0">Send <code>device_id</code> (the only required field) and optionally <code>package_name</code>. <code>country</code> and <code>installed_at</code> are filled in automatically on the server from the API call itself (IP geolocation + receive time). Repeated calls from the same <code>device_id</code> don't create duplicates - they bump that device's <b>install count</b>. All of it is stored and visible under <b>Installs</b>.</p></div>`;

  const appPickDD = makeDropdown({ placeholder: "Select an app" });
  appPickDD.setOptions(apps.map((a) => ({ value: String(a.id), html: esc(a.name) })), apps.length ? apps[0].id : "");
  $("#appPick").appendChild(appPickDD.el);
  function paintSnip() {
    const a = apps.find((x) => String(x.id) === String(appPickDD.value));
    if (!a) { $("#snip").textContent = "Create an app first"; $("#tabs").innerHTML = ""; return; }
    const snips = SNIPPETS(host, a.package_name || "com.example.app", a.api_key);
    const names = Object.keys(snips);
    if (!paintSnip.tab || !names.includes(paintSnip.tab)) paintSnip.tab = names[0];
    $("#tabs").innerHTML = names.map((n) => `<button data-n="${n}" class="${n === paintSnip.tab ? "on" : ""}">${n}</button>`).join("");
    $("#snip").textContent = snips[paintSnip.tab];
    $$("#tabs button").forEach((b) => (b.onclick = () => { paintSnip.tab = b.dataset.n; paintSnip(); }));
  }
  appPickDD.onchange = paintSnip;
  if (apps.length) paintSnip();

  $("#af").onsubmit = async (e) => {
    e.preventDefault();
    const form = e.target;
    const pkg = (form.package_name.value || "").trim();
    try {
      const r = await api("/api/apps", { method: "POST", body: Object.fromEntries(new FormData(form)) });
      viewApps();
      if (pkg && !r.icon_url) setTimeout(() => uiAlert("App created, but this package name was not found on the Play Store or App Store - no icon was fetched. Check the package name and use the 'Edit' or 'Icon' button.", { title: "Icon not found", type: "warn" }), 200);
    }
    catch (er) { uiError(er.message); }
  };
  $("#tb").onclick = async (e) => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const id = b.dataset.id, keyEl = b.closest("tr").querySelector(".key");
    if (b.dataset.act === "show") {
      const open = keyEl.textContent.includes("•");
      keyEl.textContent = open ? keyEl.dataset.key : keyEl.dataset.key.slice(0, 7) + "••••••••••••";
      b.textContent = open ? "Hide" : "Show";
    } else if (b.dataset.act === "copy") {
      try { await navigator.clipboard.writeText(keyEl.dataset.key); b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1200); } catch { uiAlert(keyEl.dataset.key, { title: "API key (copy failed)" }); }
    } else if (b.dataset.act === "edit") {
      editApp(id);
    } else if (b.dataset.act === "rotate") {
      if (!(await uiConfirm("A new key will be created. The old key stops working immediately. Continue?", { title: "Rotate API key?", type: "warn", confirmText: "Rotate" }))) return;
      await api(`/api/apps/${id}/rotate-key`, { method: "POST" }); viewApps();
    } else if (b.dataset.act === "icon") {
      b.textContent = "…";
      try {
        const r = await api(`/api/apps/${id}/icon`, { method: "POST" });
        viewApps();
        if (!r.found) uiAlert("This package name was not found on the Play Store or App Store - no icon was fetched. Use 'Edit' to fix the package name.", { title: "Icon not found", type: "warn" });
      } catch (er) { uiError(er.message); viewApps(); }
    } else if (b.dataset.act === "del") {
      if (!(await uiConfirm(`Delete "${b.dataset.name}" and all of its install data? This cannot be undone.`, { title: "Delete app?", type: "danger", confirmText: "Delete" }))) return;
      await api(`/api/apps/${id}`, { method: "DELETE" }); viewApps();
    }
  };
}

/* ---------- view: users (admin) ---------- */
async function viewUsers() {
  const m = $("#main");
  const [{ users }, { apps }] = await Promise.all([api("/api/users"), api("/api/apps")]);
  state.apps = apps;
  const appName = Object.fromEntries(apps.map((a) => [a.id, a.name]));
  const checks = (sel = []) => apps.length
    ? apps.map((a) => `<label><input type="checkbox" value="${a.id}" ${sel.includes(a.id) ? "checked" : ""}> ${esc(a.name)}</label>`).join("")
    : '<span class="muted">Add an app first</span>';
  const picked = (el) => [...el.querySelectorAll("input[type=checkbox]:checked")].map((c) => Number(c.value));

  m.innerHTML = `<div class="card"><h2>Create sub user</h2><p class="sub">A sub user can only see data for the apps selected here.</p>
    <form id="uf" class="form-grid" style="max-width:440px">
    <input name="username" placeholder="Username" required autocomplete="off"><input name="password" type="password" placeholder="Password (min 8)" required autocomplete="new-password">
    <div><div class="muted">Allowed apps</div><div class="checks" id="uc">${checks()}</div></div><div class="msg" id="um"></div><button class="btn">Create user</button></form></div>
    <div class="card"><h2>Users</h2><div class="tablewrap"><table><thead><tr><th>Username</th><th>Role</th><th>Apps with access</th><th></th></tr></thead><tbody id="ut">
    ${users.map((u) => `<tr><td><b>${esc(u.username)}</b></td><td>${u.role === "admin" ? "Main admin" : "Sub user"}</td>
    <td>${u.role === "admin" ? '<span class="muted">All apps</span>' : u.app_ids.length ? u.app_ids.map((i) => `<span class="chip">${esc(appName[i] || "?")}</span>`).join("") : '<span class="muted">None</span>'}</td>
    <td class="row">${u.role === "admin" ? "" : `<button class="btn ghost sm" data-act="edit" data-id="${u.id}">Edit</button><button class="btn danger sm" data-act="del" data-id="${u.id}" data-name="${esc(u.username)}">Delete</button>`}</td></tr>`).join("")}</tbody></table></div></div>`;

  $("#uf").onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target));
    try { await api("/api/users", { method: "POST", body: { username: fd.username, password: fd.password, app_ids: picked($("#uc")) } }); viewUsers(); }
    catch (er) { $("#um").textContent = er.message; }
  };
  $("#ut").onclick = async (e) => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const u = users.find((x) => x.id === Number(b.dataset.id));
    if (b.dataset.act === "del") {
      if (!(await uiConfirm(`Delete user "${b.dataset.name}"?`, { title: "Delete user?", type: "danger", confirmText: "Delete" }))) return;
      await api(`/api/users/${u.id}`, { method: "DELETE" }); viewUsers();
    } else {
      modal(`<h3>Edit ${esc(u.username)}</h3><form id="ef" class="form-grid"><div><div class="muted">Allowed apps</div><div class="checks" id="ec">${checks(u.app_ids)}</div></div>
        <input name="password" type="password" placeholder="New password (blank = no change)" autocomplete="new-password"><div class="msg" id="em"></div>
        <div class="row"><button class="btn">Save</button><button type="button" class="btn ghost" data-close>Cancel</button></div></form>`, () => {
        $("#ef").onsubmit = async (ev) => {
          ev.preventDefault();
          try { await api(`/api/users/${u.id}`, { method: "PUT", body: { app_ids: picked($("#ec")), password: new FormData(ev.target).get("password") } }); $("#modal").close(); viewUsers(); }
          catch (er) { $("#em").textContent = er.message; }
        };
      });
    }
  };
}

boot();
</script>
