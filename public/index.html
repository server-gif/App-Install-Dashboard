<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>App Install Dashboard</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --card: #fff;
      --text: #14171c;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #4f46e5;
      --brand-soft: #eef2ff;
      --ok: #16a34a;
      --bad: #dc2626;
      --bar: #6366f1;
      --side-bg: #0071f6;
      --side-text: #fff;
      --side-muted: rgba(255, 255, 255, .82);
      --side-line: rgba(255, 255, 255, .22);
      --side-hover: rgba(255, 255, 255, .14);
      --side-active: #fff;
      --side-active-text: #0071f6;
      color-scheme: light
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif
    }

    .app {
      display: flex;
      min-height: 100vh
    }

    .side {
      width: 236px;
      flex: 0 0 236px;
      background: var(--side-bg);
      color: var(--side-text);
      border-right: 1px solid var(--side-line);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: visible;
      transition: width .18s ease, flex-basis .18s ease
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid var(--side-line);
      font-weight: 700;
      font-size: 15px
    }

    .brand svg {
      color: var(--side-text);
      flex: 0 0 auto
    }

    .brand .cbt {
      margin-left: auto;
      background: none;
      border: 1px solid var(--side-line);
      border-radius: 7px;
      padding: 4px 6px;
      cursor: pointer;
      color: var(--side-muted);
      display: grid;
      place-items: center
    }

    .brand .cbt:hover {
      color: var(--side-text);
      background: var(--side-hover)
    }

    .side nav {
      padding: 10px;
      display: grid;
      gap: 2px;
      flex: 1;
      align-content: start;
      overflow: visible
    }

    .side nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      color: var(--side-muted);
      text-decoration: none;
      font-weight: 500;
      white-space: nowrap
    }

    .side nav a:hover {
      background: var(--side-hover);
      color: var(--side-text)
    }

    .side nav a.on {
      background: var(--side-active);
      color: var(--side-active-text);
      font-weight: 600
    }

    .side nav a svg {
      flex: 0 0 auto
    }

    .side .grp {
      padding: 14px 12px 4px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--side-muted)
    }

    .foot {
      padding: 12px;
      border-top: 1px solid var(--side-line);
      display: grid;
      gap: 8px;
      overflow: visible
    }

    .who {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0
    }

    .av {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--side-hover);
      color: var(--side-text);
      display: grid;
      place-items: center;
      font-weight: 700;
      flex: 0 0 auto
    }

    .who b {
      display: block;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .who span {
      font-size: 11px;
      color: var(--side-muted)
    }

    .side .foot .btn.ghost {
      color: var(--side-text);
      border-color: var(--side-line)
    }

    .side .foot .btn.ghost:hover {
      background: var(--side-hover);
      border-color: var(--side-hover);
      color: var(--side-text)
    }

    .foot .row .icobtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex: 1 1 auto
    }

    .foot .row .icobtn svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto
    }

    #sbe {
      display: none
    }

    /* instant styled tooltips for the collapsed icon rail (native title is slow + unstyled) */
    .app.collapsed .side nav a,
    .app.collapsed .foot .icobtn,
    .app.collapsed .brand #sbe {
      position: relative
    }

    .app.collapsed .side [data-tip]::after,
    .app.collapsed .foot [data-tip]::after,
    .app.collapsed .brand [data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      left: calc(100% + 14px);
      top: 50%;
      transform: translateY(-50%) translateX(-5px);
      background: #111827;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      padding: 7px 10px;
      border-radius: 8px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .28);
      transition: opacity .14s ease, transform .14s ease;
      z-index: 90
    }

    .app.collapsed .side [data-tip]::before,
    .app.collapsed .foot [data-tip]::before,
    .app.collapsed .brand [data-tip]::before {
      content: "";
      position: absolute;
      left: calc(100% + 9px);
      top: 50%;
      transform: translateY(-50%);
      border: 5px solid transparent;
      border-right-color: #111827;
      opacity: 0;
      pointer-events: none;
      transition: opacity .14s ease;
      z-index: 90
    }

    .app.collapsed .side [data-tip]:hover::after,
    .app.collapsed .foot [data-tip]:hover::after,
    .app.collapsed .brand [data-tip]:hover::after {
      opacity: 1;
      transform: translateY(-50%) translateX(0)
    }

    .app.collapsed .side [data-tip]:hover::before,
    .app.collapsed .foot [data-tip]:hover::before,
    .app.collapsed .brand [data-tip]:hover::before {
      opacity: 1
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column
    }

    .top {
      display: none;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 10px 14px;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 20
    }

    .burger {
      background: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 9px;
      cursor: pointer;
      color: var(--text);
      display: grid
    }

    main {
      padding: 20px;
      max-width: none;
      margin: 0;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column
    }

    main>.card:last-child {
      margin-bottom: 0
    }

    /* the last top-level card stretches to the bottom of the viewport, so no dead grey strip is left under the content */
    main>.card:last-child:has(.appcards),
    main>.card:last-child:has(.tablewrap) {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0
    }

    main>.card:last-child>.tablewrap {
      flex: 1;
      max-height: none
    }

    main>.card:last-child>.appcards {
      flex: 1;
      align-content: start
    }

    @media(min-width:1700px) {
      main {
        padding: 24px 32px
      }
    }

    @media(max-width:900px) {
      .side {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform .18s;
        box-shadow: 0 0 40px rgba(0, 0, 0, .25)
      }

      .side.open {
        transform: none
      }

      .top {
        display: flex
      }

      main {
        padding: 14px
      }

      #scrim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .45);
        z-index: 45
      }
    }

    @media(min-width:901px) {

      /* collapsed = slim icon rail (logo + open/close + icons stay visible, labels hidden) */
      .app.collapsed .side {
        width: 68px;
        flex: 0 0 68px;
        z-index: 40
      }

      .app.collapsed .brand {
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 14px 0
      }

      .app.collapsed .brand span,
      .app.collapsed .brand #sbc {
        display: none
      }

      .app.collapsed .side nav {
        padding: 10px 8px
      }

      .app.collapsed .side nav a {
        justify-content: center;
        gap: 0;
        padding: 10px 0
      }

      .app.collapsed .side nav a .lbl {
        display: none
      }

      .app.collapsed .foot {
        padding: 12px 0
      }

      .app.collapsed .who {
        justify-content: center
      }

      .app.collapsed .who>div:not(.av) {
        display: none
      }

      .app.collapsed .brand #sbe {
        display: grid;
        margin-left: 0
      }

      .app.collapsed .foot .row {
        flex-direction: column;
        gap: 6px
      }

      .app.collapsed .foot .row .icobtn {
        flex: 0 0 auto;
        width: 42px;
        height: 42px;
        padding: 0;
        margin: 0 auto;
        border-radius: 12px;
        justify-content: center
      }

      .app.collapsed .foot .row .icobtn svg {
        width: 18px;
        height: 18px
      }

      .app.collapsed .foot .row .icobtn .lbl {
        display: none
      }
    }

    #scrim {
      display: none
    }

    #scrim.on {
      display: block
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 15px
    }

    .card .sub {
      margin: -6px 0 12px;
      color: var(--muted);
      font-size: 13px
    }

    .grid4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      margin-bottom: 16px
    }

    .grid4 .card {
      margin: 0
    }

    .kpi {
      position: relative;
      overflow: hidden;
      display: flex;
      gap: 14px;
      align-items: center;
      background: linear-gradient(180deg, #fff, #f7f9ff);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 2px 4px rgba(20, 27, 45, .05), 0 14px 26px -14px rgba(20, 27, 45, .20)
    }

    .kpi::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--accent, var(--brand))
    }

    .kpi-ico {
      flex: 0 0 auto;
      width: 46px;
      height: 46px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent, var(--brand)) 72%, #fff), var(--accent, var(--brand)));
      box-shadow: 0 8px 16px -8px color-mix(in srgb, var(--accent, var(--brand)) 80%, transparent), inset 0 1px 0 rgba(255, 255, 255, .4)
    }

    .kpi-ico svg {
      width: 22px;
      height: 22px
    }

    .kpi-body {
      min-width: 0
    }

    .kpi .l {
      color: var(--muted);
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: .05em;
      font-weight: 600
    }

    .kpi .v {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.1;
      margin-top: 1px;
      color: var(--text)
    }

    .kpi .s {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px
    }

    .kpi.total {
      --accent: var(--brand)
    }

    .kpi.today {
      --accent: var(--ok)
    }

    .kpi.period {
      --accent: #0071f6
    }

    /* app detail header + table niceties */
    /* sticky top region on the detail page: keeps the back link + hero pinned together while the body scrolls under */
    .detail-top {
      position: sticky;
      top: 0;
      z-index: 25;
      background: var(--bg);
      padding: 12px 0 16px;
      margin: -12px 0 0
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
      margin-bottom: 12px
    }

    .back-link:hover {
      color: var(--brand)
    }

    .detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: linear-gradient(180deg, #fff, #f6f8ff);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 2px 4px rgba(20, 27, 45, .05), 0 14px 26px -14px rgba(20, 27, 45, .22)
    }

    .dh-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0
    }

    .dh-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.01em;
      line-height: 1.2
    }

    .dh-pkg {
      margin-top: 3px;
      font-size: 12px;
      color: var(--muted)
    }

    .dh-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap
    }

    .card-h {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 0 0 12px
    }

    .card-h h2 {
      margin: 0
    }

    .card-h .cnt {
      color: var(--muted);
      font-weight: 400;
      font-size: 13px
    }

    table.brk .rank {
      display: inline-grid;
      place-items: center;
      min-width: 22px;
      height: 22px;
      padding: 0 5px;
      border-radius: 7px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 11px;
      font-weight: 700;
      margin-right: 10px;
      vertical-align: middle
    }

    td code {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 11.5px;
      color: var(--muted)
    }

    .up {
      color: var(--ok)
    }

    .down {
      color: var(--bad)
    }

    .cols {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 16px;
      align-items: stretch
    }

    .cols .card {
      margin: 0
    }

    .cols>.card {
      display: flex;
      flex-direction: column
    }

    .cols>.card .hblist,
    .cols>.card .tablewrap {
      flex: 1;
      min-height: 0
    }

    .cols>.card>.pager {
      margin-top: auto
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 25;
      background: var(--bg);
      padding: 14px 0 12px;
      margin: -14px 0 4px;
    }

    input,
    select {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      min-width: 0
    }

    input:focus,
    select:focus {
      outline: 2px solid var(--brand);
      outline-offset: -1px
    }

    .btn {
      background: var(--brand);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      display: inline-grid;
      place-items: center
    }

    .btn.ghost {
      background: none;
      color: var(--text);
      border: 1px solid var(--line);
      font-weight: 500
    }

    .btn.danger {
      background: none;
      color: var(--bad);
      border: 1px solid var(--line);
      font-weight: 500
    }

    .btn.sm {
      padding: 4px 10px;
      font-size: 12px
    }

    .seg {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden
    }

    .seg button {
      background: var(--card);
      color: var(--muted);
      border: 0;
      padding: 7px 12px;
      cursor: pointer;
      font: inherit
    }

    .seg button.on {
      background: var(--brand-soft);
      color: var(--brand);
      font-weight: 600
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th,
    td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap
    }

    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 11.5px;
      letter-spacing: .02em;
      position: sticky;
      top: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--line)
    }

    tr.click {
      cursor: pointer
    }

    tr.click:hover td {
      background: var(--brand-soft)
    }

    .tablewrap {
      overflow: auto;
      max-height: 70vh
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums
    }

    td.c {
      text-align: center;
      color: var(--muted)
    }

    .heat {
      color: var(--text);
      font-weight: 600
    }

    .hb {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 10px;
      margin-bottom: 10px
    }

    .hb .t {
      height: 6px;
      background: var(--line);
      border-radius: 3px;
      grid-column: 1/3;
      overflow: hidden
    }

    .hb .t i {
      display: block;
      height: 100%;
      background: var(--bar);
      border-radius: 3px
    }

    td .t {
      height: 8px;
      background: var(--line);
      border-radius: 99px;
      min-width: 70px;
      overflow: hidden
    }

    td .t i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #7c6ce6, var(--brand));
      border-radius: 99px
    }

    tr.sel td {
      background: var(--brand-soft)
    }

    tr.sel td b {
      color: var(--brand)
    }

    table.matrix {
      width: 100%
    }

    table.matrix th,
    table.matrix td {
      padding: 8px 14px
    }

    table.matrix .num {
      text-align: center
    }

    table.matrix td:first-child,
    table.matrix th:first-child {
      min-width: 170px
    }

    table.matrix tfoot td {
      border-bottom: 0;
      border-top: 2px solid var(--line);
      position: sticky;
      bottom: 0;
      background: var(--card)
    }

    table.brk th:last-child,
    table.brk td:last-child {
      width: 52%
    }

    table.brk td:first-child {
      padding-right: 28px
    }

    table.brk td:last-child {
      padding-left: 14px
    }

    /* dashboard overview cards: header + stat strip + mini trend chart + country chips */
    .appcards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 14px
    }

    .appcard {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: linear-gradient(180deg, #fff 0%, #f6f8ff 100%);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transform: translateY(0);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 2px 4px rgba(20, 27, 45, .06), 0 14px 26px -10px rgba(20, 27, 45, .22)
    }

    .appcard:hover {
      transform: translateY(-5px);
      border-color: color-mix(in srgb, var(--brand) 38%, var(--line));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 8px 14px rgba(20, 27, 45, .10), 0 28px 46px -14px rgba(20, 27, 45, .32)
    }

    .ac-head {
      display: flex;
      gap: 12px;
      align-items: center
    }

    .ac-head .aic {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      font-size: 18px
    }

    .ac-head .meta {
      min-width: 0;
      flex: 1
    }

    .ac-head .an {
      font-weight: 600;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .ac-head .ap {
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .ac-go {
      flex: 0 0 auto;
      color: var(--brand);
      font-size: 12px;
      font-weight: 600;
      margin-left: auto
    }

    .ac-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px
    }

    .ac-s {
      padding: 10px 11px;
      background: linear-gradient(180deg, #fff, #f3f5fd);
      border: 1px solid var(--line);
      border-radius: 12px;
      min-width: 0;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 4px 10px -7px rgba(20, 27, 45, .35)
    }

    .ac-s:first-child {
      background: linear-gradient(180deg, #eef1ff, #e6ebff);
      border-color: color-mix(in srgb, var(--brand) 22%, var(--line))
    }

    .ac-sl {
      display: block;
      font-size: 10.5px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .ac-sv {
      display: block;
      font-size: 21px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--text);
      font-variant-numeric: tabular-nums
    }

    .ac-ss {
      display: block;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--muted)
    }

    .ac-foot {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: auto;
      min-height: 22px
    }

    .appcard:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px
    }

    .aic {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      overflow: hidden;
      background: var(--brand-soft);
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      color: var(--brand);
      font-weight: 700;
      font-size: 20px;
      box-shadow: 0 6px 14px -6px rgba(20, 27, 45, .45), inset 0 1px 0 rgba(255, 255, 255, .7)
    }

    .aic img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .aic.sm {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      font-size: 15px
    }

    .muted {
      color: var(--muted)
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 16px
    }

    .chip {
      display: inline-block;
      background: var(--brand-soft);
      color: var(--brand);
      border-radius: 999px;
      padding: 1px 9px;
      font-size: 12px;
      margin: 2px 4px 2px 0
    }

    /* ===== Apps & API admin: professional 3D section cards, form, table, snippet ===== */
    .sec {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 16px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 2px 4px rgba(20, 27, 45, .05), 0 14px 26px -14px rgba(20, 27, 45, .22)
    }

    .sec-hd {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 14px;
      padding: 0 0 12px;
      border-bottom: 1px dashed var(--line)
    }

    .sec-hd .ico {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(180deg, #4b8bff, #0071f6);
      box-shadow: 0 6px 14px -6px rgba(0, 113, 246, .75), inset 0 1px 0 rgba(255, 255, 255, .4)
    }

    .sec-hd .tt {
      min-width: 0;
      flex: 1
    }

    .sec-hd h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -.005em
    }

    .sec-hd .sub {
      margin: 3px 0 0;
      font-size: 12.5px;
      color: var(--muted)
    }

    .sec-hd .cnt {
      flex: 0 0 auto;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 12px;
      font-weight: 700;
      border: 1px solid color-mix(in srgb, var(--brand) 22%, transparent)
    }

    .sec-hd { flex-wrap: wrap; }

    .appsearch {
      flex: 0 1 260px;
      min-width: 170px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--muted);
      box-shadow: inset 0 1px 2px rgba(20, 27, 45, .05);
      transition: border-color .14s ease, box-shadow .14s ease
    }

    .appsearch:focus-within {
      border-color: color-mix(in srgb, var(--brand) 45%, var(--line));
      box-shadow: 0 0 0 3px var(--brand-soft)
    }

    .appsearch input {
      border: 0;
      background: none;
      outline: none;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      width: 100%;
      min-width: 0;
      padding: 0
    }

    /* Add app form */
    .add-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)) auto;
      gap: 12px;
      align-items: end
    }

    .add-form .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0
    }

    .add-form .field label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted)
    }

    .add-form .field input {
      padding: 10px 12px;
      border-radius: 10px;
      background: linear-gradient(180deg, #fff, #f7f9ff);
      border: 1px solid var(--line);
      font-size: 13.5px;
      box-shadow: inset 0 1px 2px rgba(20, 27, 45, .05)
    }

    .add-form .field input:focus {
      outline: 2px solid var(--brand);
      outline-offset: -1px;
      background: #fff
    }

    .add-form .submit .btn {
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      background: linear-gradient(180deg, #4b8bff, #0071f6);
      box-shadow: 0 6px 14px -6px rgba(0, 113, 246, .75), inset 0 1px 0 rgba(255, 255, 255, .4);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform .14s ease, box-shadow .14s ease
    }

    .add-form .submit .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px -8px rgba(0, 113, 246, .85), inset 0 1px 0 rgba(255, 255, 255, .4)
    }

    .add-note {
      margin: 12px 0 0;
      padding: 10px 12px;
      border-radius: 10px;
      background: linear-gradient(180deg, #f7f9ff, #eef2ff);
      border: 1px dashed color-mix(in srgb, var(--brand) 25%, var(--line));
      color: var(--muted);
      font-size: 12.5px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      line-height: 1.5
    }

    .add-note svg {
      flex: 0 0 auto;
      color: var(--brand);
      margin-top: 2px
    }

    /* Apps table (3D rows) */
    .applist {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 10px;
      margin: 0
    }

    .applist thead th {
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      padding: 6px 12px;
      border: 0;
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--card)
    }

    .applist thead th.num {
      text-align: right
    }

    .applist tbody tr {
      transition: transform .16s ease
    }

    .applist tbody tr td {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
      vertical-align: middle;
      background: linear-gradient(180deg, #fff, #f7f9ff);
      transition: border-color .16s ease, background .16s ease
    }

    .applist tbody tr td:first-child {
      border-left: 1px solid var(--line);
      border-top-left-radius: 12px;
      border-bottom-left-radius: 12px
    }

    .applist tbody tr td:last-child {
      border-right: 1px solid var(--line);
      border-top-right-radius: 12px;
      border-bottom-right-radius: 12px;
      text-align: right
    }

    .applist tbody tr:hover td {
      border-color: color-mix(in srgb, var(--brand) 32%, var(--line));
      background: linear-gradient(180deg, #fff, #eef3ff)
    }

    .applist .app-cell {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0
    }

    .applist .app-cell .aic {
      width: 40px;
      height: 40px;
      font-size: 16px;
      border-radius: 11px
    }

    .applist .app-cell .an {
      font-weight: 700;
      font-size: 14px;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .applist .app-cell .ap {
      font-size: 11.5px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .applist .inst-pill {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 999px;
      background: linear-gradient(180deg, #eef1ff, #e6ebff);
      border: 1px solid color-mix(in srgb, var(--brand) 22%, var(--line));
      color: var(--brand);
      font-weight: 700;
      font-size: 12.5px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9)
    }

    .applist .inst-pill small {
      font-weight: 500;
      color: var(--muted);
      font-size: 10.5px
    }

    .applist .key {
      background: linear-gradient(180deg, #fff, #f7f9ff);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11.5px;
      cursor: pointer;
      position: relative;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 2px 4px -2px rgba(20, 27, 45, .15);
      color: var(--text)
    }

    .applist .key::after {
      content: "Copied \2713";
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--ok);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .12s ease;
      z-index: 100
    }

    .applist .key:hover {
      border-color: color-mix(in srgb, var(--brand) 32%, var(--line));
      color: var(--brand)
    }

    .applist .key.copied {
      border-color: var(--ok);
      color: var(--ok);
      background: color-mix(in srgb, var(--ok) 8%, #fff);
      z-index: 60
    }

    .applist .key.copied::after {
      opacity: 1;
      visibility: visible
    }

    .applist .act {
      display: inline-flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: flex-end
    }

    .applist .act .btn {
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 8px;
      display: inline-grid;
      place-items: center;
      position: relative;
      background: linear-gradient(180deg, #fff, #f7f9ff);
      border: 1px solid var(--line);
      color: var(--muted);
      transition: color .14s ease, border-color .14s ease, background .14s ease, transform .14s ease
    }

    .applist .act .btn:hover {
      color: var(--brand);
      border-color: color-mix(in srgb, var(--brand) 38%, var(--line));
      background: #fff;
      transform: translateY(-1px);
      z-index: 60
    }

    .applist .act .btn.on {
      color: var(--brand);
      border-color: color-mix(in srgb, var(--brand) 38%, var(--line));
      background: var(--brand-soft)
    }

    .applist .act .btn.danger {
      color: var(--bad);
      border-color: color-mix(in srgb, var(--bad) 28%, var(--line))
    }

    .applist .act .btn.danger:hover {
      background: color-mix(in srgb, var(--bad) 8%, #fff);
      border-color: var(--bad);
      color: var(--bad)
    }

    .applist .act .btn::after {
      content: attr(data-tip);
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .08s ease;
      z-index: 100
    }

    .applist .act .btn:hover::after {
      opacity: 1;
      visibility: visible
    }

    .applist .act .btn:last-child::after {
      left: auto;
      right: 0;
      transform: none
    }

    /* Snippet panel */
    .snip-hd-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    .snip-tabs {
      display: inline-flex;
      padding: 4px;
      background: linear-gradient(180deg, #f3f5fd, #eaeefc);
      border: 1px solid var(--line);
      border-radius: 10px;
      gap: 2px;
      box-shadow: inset 0 1px 2px rgba(20, 27, 45, .06)
    }

    .snip-tabs button {
      background: none;
      border: 0;
      padding: 6px 12px;
      border-radius: 7px;
      font: inherit;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: background .14s ease, color .14s ease, box-shadow .14s ease
    }

    .snip-tabs button:hover {
      color: var(--text)
    }

    .snip-tabs button.on {
      background: #fff;
      color: var(--brand);
      box-shadow: 0 2px 6px -2px rgba(20, 27, 45, .25), inset 0 1px 0 rgba(255, 255, 255, .9)
    }

    .snip-body {
      position: relative;
      background: linear-gradient(180deg, #0f172a, #1e293b);
      border-radius: 12px;
      padding: 14px;
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 8px 20px -10px rgba(15, 23, 42, .55)
    }

    .snip-body pre {
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      color: #e2e8f0;
      font-size: 12px;
      line-height: 1.55;
      overflow: auto;
      max-height: 340px;
      white-space: pre
    }

    .snip-copy {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, .08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      z-index: 2
    }

    .snip-copy:hover {
      background: rgba(255, 255, 255, .16);
      color: #fff
    }

    .snip-copy.ok {
      background: rgba(34, 197, 94, .22);
      color: #86efac;
      border-color: rgba(134, 239, 172, .35)
    }

    /* section cards: table scrolls within its own container */
    .sec .tablewrap {
      max-height: 60vh;
      overflow-x: hidden;
      overflow-y: auto;
      padding-bottom: 28px
    }

    /* ===== "how data flows" stepper (elevated numbered tiles + connectors) ===== */
    .flow {
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      gap: 10px
    }

    .flow-step {
      position: relative;
      flex: 1 1 210px;
      min-width: 180px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(180deg, #fff, #f6f8ff);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 2px 4px rgba(20, 27, 45, .05), 0 12px 22px -12px rgba(20, 27, 45, .22);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease
    }

    .flow-step:hover {
      transform: translateY(-3px);
      border-color: color-mix(in srgb, var(--brand) 35%, var(--line));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 8px 14px rgba(20, 27, 45, .10), 0 22px 36px -14px rgba(20, 27, 45, .30)
    }

    .flow-num {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 15px;
      color: #fff;
      background: linear-gradient(180deg, #4b8bff, #0071f6);
      box-shadow: 0 6px 14px -6px rgba(0, 113, 246, .75), inset 0 1px 0 rgba(255, 255, 255, .4)
    }

    .flow-txt {
      min-width: 0
    }

    .flow-t {
      font-weight: 600;
      font-size: 13px;
      line-height: 1.3;
      color: var(--text)
    }

    .flow-s {
      font-size: 11.5px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .flow-arrow {
      flex: 0 0 auto;
      align-self: center;
      display: grid;
      place-items: center;
      color: color-mix(in srgb, var(--brand) 55%, var(--muted))
    }

    @media(max-width:560px) {
      .flow-arrow {
        transform: rotate(90deg)
      }
    }

    code,
    pre {
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace
    }

    pre {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      overflow: auto;
      margin: 0
    }

    .key {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 2px 6px;
      cursor: pointer
    }

    svg text.ax {
      fill: var(--muted);
      font-size: 10px
    }

    svg line.grid {
      stroke: var(--line);
      stroke-width: 1
    }

    svg rect.b {
      fill: var(--bar)
    }

    svg rect.b:hover {
      opacity: .7
    }

    #tip {
      position: fixed;
      pointer-events: none;
      background: #111827;
      color: #fff;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      display: none;
      z-index: 99
    }

    .auth {
      max-width: 360px;
      margin: 12vh auto;
      padding: 0 16px
    }

    .auth .card {
      padding: 22px
    }

    .auth form {
      display: grid;
      gap: 10px
    }

    .auth h1 {
      font-size: 20px;
      margin: 0 0 4px
    }

    .msg {
      color: var(--bad);
      min-height: 18px;
      font-size: 13px
    }

    dialog {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      padding: 20px;
      width: min(460px, 92vw)
    }

    dialog.wide {
      width: min(740px, 94vw)
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, .5)
    }

    dialog h3 {
      margin: 0 0 12px
    }

    .checks {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      max-height: 260px;
      overflow: auto;
      margin: 0;
      padding: 2px
    }

    .checks.cols {
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      max-height: 320px
    }

    .checks .ck {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(180deg, #fff, #f7f9ff);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9);
      cursor: pointer;
      transition: border-color .14s ease, background .14s ease, box-shadow .14s ease
    }

    .checks .ck:hover {
      border-color: color-mix(in srgb, var(--brand) 35%, var(--line))
    }

    .checks .ck .aic {
      width: 30px;
      height: 30px;
      font-size: 13px;
      border-radius: 9px;
      flex: 0 0 auto
    }

    .checks .ck .ck-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px
    }

    .checks .ck .ck-n {
      font-weight: 600;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .checks .ck .ck-p {
      font-size: 11.5px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .checks .ck input {
      width: 18px;
      height: 18px;
      accent-color: var(--brand);
      flex: 0 0 auto;
      cursor: pointer;
      margin: 0
    }

    .checks .ck:has(input:checked) {
      border-color: var(--brand);
      background: linear-gradient(180deg, #fff, var(--brand-soft));
      box-shadow: inset 0 0 0 1px var(--brand), 0 8px 16px -12px rgba(0, 113, 246, .7)
    }

    .uapps {
      margin-top: 16px
    }

    .uapps-hd {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      margin-bottom: 10px
    }

    .uapps-hd svg {
      color: var(--brand)
    }

    .uapps-hd small {
      margin-left: auto;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 500;
      font-size: 11.5px
    }

    .applist .uav {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 16px;
      color: #fff;
      background: linear-gradient(180deg, #7c93ff, #4b5bd6);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 4px 10px -6px rgba(76, 91, 214, .8)
    }

    .applist .role {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      border: 1px solid transparent
    }

    .applist .role.admin {
      color: var(--brand);
      background: var(--brand-soft);
      border-color: color-mix(in srgb, var(--brand) 22%, transparent)
    }

    .applist .role.sub {
      color: var(--muted);
      background: #f1f3f9;
      border-color: var(--line)
    }

    .applist.users-tb .uapps-cell {
      white-space: normal
    }

    .applist.users-tb td:last-child,
    .applist.users-tb th:last-child {
      width: 1%
    }

    .applist.users-tb .act {
      flex-wrap: nowrap
    }

    .form-grid {
      display: grid;
      gap: 10px
    }

    /* ===== styled system dialog (replaces native alert/confirm) ===== */
    #sysdlg {
      border: 0;
      padding: 0;

    }

    .drp-panel {

      }

      }

      }
    }

</head>

    const lastDays = (n) => { const t = new Date(), f = new Date(); f.setDate(t.getDate() - (n - 1)); return { from: isoL(f), to: isoL(t) }; };
    const spanDays = (a, b) => (a && b ? Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000) + 1 : 0);
    const dLab = (s) => { try { return new Date(s + "T00:00:00").toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }); } catch { return s; } };
    const closeAllDrp = (except) => $$(".drp-panel").forEach((p) => { if (p !== except) p.hidden = true; });
    // ignore detached targets: in-panel clicks call render() which replaces the clicked node, and an
    // orphaned node would otherwise look like an outside click and wrongly close the panel
    document.addEventListener("click", (e) => { const t = e.target; if (t && t.isConnected && !t.closest(".drp-wrap")) closeAllDrp(); });
    document.addEventListener("click", (e) => { const t = e.target; if (t && t.isConnected && !t.closest(".csel")) closeAllCsel(); });
    // mount a calendar button + dropdown panel that edits `range` ({from,to}) and calls onApply when a range is chosen
    function rangeControl(mount, range, onApply, opts = {}) {
      mount.innerHTML = "";
      const wrap = document.createElement("span"); wrap.className = "drp-wrap";
      const btn = document.createElement("button"); btn.type = "button"; btn.className = "btn ghost sm drp-toggle";
      const panel = document.createElement("div"); panel.className = "drp-panel"; panel.hidden = true;
      const paint = () => { btn.innerHTML = `${ICON.cal}<span>${range.from && range.to ? dLab(range.from) + " \u2192 " + dLab(range.to) : (opts.emptyLabel || "Select dates")}</span>`; };
      paint();
      let dp = null;
      // keep the panel fully inside the viewport: clamp horizontally, and flip above the
      // toggle when there isn't room below (so it never gets clipped by the window edge)
      const positionDrp = () => {
        if (panel.hidden) return;
        const wr = wrap.getBoundingClientRect();
        const vw = window.innerWidth, vh = window.innerHeight, m = 8, gap = 8;
        // horizontal: anchor the panel's right edge to the toggle's right edge (so a right-side
        // control drops neatly under it instead of spilling past the card), then clamp in-viewport
        const w = panel.offsetWidth || panel.getBoundingClientRect().width;
        let left = wr.width - w;
        if (wr.left + left < m) left = m - wr.left;
        if (wr.left + left + w > vw - m) left = vw - m - wr.left - w;
        panel.style.left = left + "px";
        // vertical: prefer below; flip above when it would overflow the bottom and fits better up top
        const h = panel.offsetHeight || panel.getBoundingClientRect().height;
        const below = vh - wr.bottom - gap - m;
        const above = wr.top - gap - m;
        if (h <= below || (h > above && below >= above)) {
          panel.style.top = (wr.height + gap) + "px";
          panel.style.bottom = "auto";
          panel.style.maxHeight = Math.max(200, below) + "px";
        } else {
          panel.style.top = "auto";
          panel.style.bottom = (wr.height + gap) + "px";
          panel.style.maxHeight = Math.max(200, above) + "px";
        }
        panel.style.overflowY = panel.scrollHeight > panel.clientHeight ? "auto" : "visible";
      };

        if (!dp) dp = new DateRangePicker(panel, { format: "YYYY-MM-DD", applyOnPreset: true, onApply: (x) => { range.from = x.from; range.to = x.to; paint(); onApply(x); panel.hidden = true; }, onCancel: () => { panel.hidden = true; } });

    }
    const flag = (cc) => (/^[A-Z]{2}$/.test(cc || "") && cc !== "XX" ? String.fromCodePoint(...[...cc].map((c) => 127397 + c.charCodeAt(0))) : "\u{1F310}");
    const cName = (cc) => { try { return new Intl.DisplayNames(["en"], { type: "region" }).of(cc) || cc; } catch { return cc; } };
    const cap = (s) => (s ? s[0].toUpperCase() + s.slice(1) : "Unknown");
    // store icon with a letter-avatar fallback (the letter shows behind the image, and if the image fails to load)
    function appIcon(a, sm) {
      const ph = esc((a.name || "?").trim().charAt(0).toUpperCase());
      return `<div class="aic${sm ? " sm" : ""}">${ph}${a.icon_url ? `<img src="${esc(a.icon_url)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>`;
    }

    /* ---------- modal ---------- */

    /* ---------- styled alert / confirm (replaces native alert / confirm) ---------- */
    const SYS_ICONS = {
      info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
      warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 21 19H3z"/><path d="M12 10v4M12 17h.01"/></svg>',
      danger: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
    };
    function sysDialog({ title, message, type = "info", confirmText, cancelText }) {
      return new Promise((resolve) => {
        const d = $("#sysdlg");
        const isConfirm = !!cancelText;
        d.innerHTML = `<div class="sysbox ${type}"><div class="sic">${SYS_ICONS[type] || SYS_ICONS.info}</div>
      <h3>${esc(title)}</h3><p>${esc(message)}</p>
      <div class="sacts">${isConfirm ? `<button class="btn ghost" id="sysno">${esc(cancelText)}</button>` : ""}
      <button class="btn ${type === "danger" ? "solid-danger" : ""}" id="sysyes">${esc(confirmText || "OK")}</button></div></div>`;
        const done = (v) => { d.close(); resolve(v); };

    const uiAlert = (message, o = {}) => sysDialog({ title: o.title || "Notice", message, type: o.type || "info", confirmText: o.confirmText || "OK" });
    const uiError = (message) => sysDialog({ title: "Error", message, type: "warn", confirmText: "OK" });
    const uiConfirm = (message, o = {}) => sysDialog({ title: o.title || "Are you sure?", message, type: o.type || "info", confirmText: o.confirmText || "Confirm", cancelText: o.cancelText || "Cancel" });
    function changePassword() {
      modal(`<h3>Change password</h3><form id="pf" class="form-grid"><input name="current" type="password" placeholder="Current password" required>
    <input name="new" type="password" placeholder="New password (min 8)" required autocomplete="new-password"><div class="msg" id="pm"></div>
    <div class="row"><button class="btn">Save</button><button type="button" class="btn ghost" data-close>Cancel</button></div></form>`, () => {
        $("#pf").onsubmit = async (e) => {

    /* downscale a dropped / selected image into a small square data-URL (keeps it well under D1's row size) */
    function fileToIconDataUrl(file) {
      return new Promise((resolve, reject) => {
        if (!file || !/^image\//.test(file.type)) return reject(new Error("Not an image file"));
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const max = 256, scale = Math.min(1, max / Math.max(img.width, img.height));
            const c = document.createElement("canvas");
            c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            let out = c.toDataURL("image/webp", 0.9);
            if (!/^data:image\/webp/.test(out)) out = c.toDataURL("image/png");
            resolve(out);
          };
          img.onerror = () => reject(new Error("Could not read that image"));
          img.src = reader.result;
        };
        reader.onerror = () => reject(new Error("Could not read that file"));
        reader.readAsDataURL(file);
      });
    }
    /* edit an existing app's name + package name + icon (auto-fetch, paste a URL, or drag-and-drop an image) */

    /* ---------- view: dashboard (overview cards; clicking a card opens its detail page) ---------- */

    async function viewDashboard() {

    const dShort = (s) => { try { return new Date(s + "T00:00:00").toLocaleDateString("en", { month: "short", day: "numeric" }); } catch { return s; } };

    /* ---------- view: apps (admin) ---------- */

    .toString()
val req = Request.Builder().url("${host}/api/track/install")
    .header("X-API-Key", "${key}").post(body.toRequestBody("application/json".toMediaType()))
client.newCall(req.build()).enqueue(object : Callback {          // fire & forget
    override fun onFailure(call: Call, e: IOException) {}
    override fun onResponse(call: Call, response: Response) { response.close() }
})`,
      iOS: `// one time on first launch
let body: [String: Any] = [
    "device_id": UIDevice.current.identifierForVendor?.uuidString ?? "",
    "package_name": "${pkg}"
]
var req = URLRequest(url: URL(string: "${host}/api/track/install")!)
req.httpMethod = "POST"
req.setValue("${key}", forHTTPHeaderField: "X-API-Key")
req.setValue("application/json", forHTTPHeaderField: "Content-Type")
req.httpBody = try? JSONSerialization.data(withJSONObject: body)
URLSession.shared.dataTask(with: req).resume()`,
      Web: `fetch("${host}/api/track/install", {
  method: "POST",
  headers: { "Content-Type": "application/json", "X-API-Key": "${key}" },
  body: JSON.stringify({
    device_id: localStorage.getItem("iid") || crypto.randomUUID(),
    package_name: "${pkg}"
  })
})`
    });

    async function viewApps() {
      const m = $("#main");
      const { apps } = await api("/api/apps");
      apps.sort((a, b) => b.id - a.id); // newest added first
      state.apps = apps;
      const host = location.origin;
      const FLOW = [["Your app", "first launch"], ["POST /api/track/install", "one ping per install"], ["D1 database", "dedupe by device_id"], ["Dashboard", "app / country views"]];
      const flowArrow = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
      m.innerHTML = `<div class="sec">
    <div class="sec-hd"><div class="ico">${ICON.flow}</div>
      <div class="tt"><h2>How data flows</h2><p class="sub">Same <code>device_id</code> for an app is counted only once. Country is auto-detected from Cloudflare IP geolocation &mdash; never from the request body.</p></div></div>
    <div class="flow">${FLOW.map((f, i) => `<div class="flow-step"><div class="flow-num">${i + 1}</div><div class="flow-txt"><div class="flow-t">${esc(f[0])}</div><div class="flow-s">${esc(f[1])}</div></div></div>${i < FLOW.length - 1 ? `<div class="flow-arrow">${flowArrow}</div>` : ""}`).join("")}</div></div>

  <div class="sec">
    <div class="sec-hd"><div class="ico">${ICON.plus}</div>
      <div class="tt"><h2>Add app</h2><p class="sub">Register a new app to start tracking installs.</p></div></div>
    <form id="af" class="add-form">
      <div class="field"><label for="af-name">App name</label><input id="af-name" name="name" placeholder="e.g. My Game" required maxlength="60" autocomplete="off"></div>
      <div class="field"><label for="af-pkg">Package / bundle id</label><input id="af-pkg" name="package_name" placeholder="e.g. com.x.mygame" maxlength="100" autocomplete="off"></div>
      <div class="submit"><button class="btn" type="submit">${ICON.plus}<span>Create app</span></button></div></form>
    <div class="add-note">${ICON.info}<div>If a package / bundle id is provided, the app icon is auto-fetched from the Play Store (or App Store) and shown on the Dashboard card.</div></div></div>

  <div class="sec">
    <div class="sec-hd"><div class="ico">${ICON.apps}</div>
      <div class="tt"><h2>Your apps</h2><p class="sub">Manage keys, icons, and metadata for every registered app.</p></div>
      <label class="appsearch">${ICON.search}<input id="app-q" type="search" placeholder="Search by name or package\u2026" autocomplete="off" value="${esc(state.appsSearch || "")}"></label>
      <span class="cnt" id="applist-cnt">${apps.length} ${apps.length === 1 ? "app" : "apps"}</span></div>
    <div class="tablewrap"><table class="applist"><thead><tr><th>App</th><th class="num">Installs</th><th>API key</th><th></th></tr></thead><tbody id="tb">
    ${apps.length ? apps.map((a) => `<tr data-s="${esc((((a.name || "")) + " " + (a.package_name || "")).toLowerCase())}">
      <td><div class="app-cell">${appIcon(a, true)}<div style="min-width:0;flex:1"><div class="an">${esc(a.name)}</div><div class="ap">${esc(a.package_name || "no package set")}</div></div></div></td>
      <td class="num"><span class="inst-pill">${fmt(a.total)}<small>total</small></span></td>
      <td><code class="key" data-key="${esc(a.api_key)}" title="Click to copy">${esc(a.api_key.slice(0, 7))}••••••••••••</code></td>
      <td><div class="act"><button class="btn ghost sm" data-act="show" data-id="${a.id}" data-tip="Show key">${ICON.eye}</button>
    <button class="btn ghost sm" data-act="edit" data-id="${a.id}" data-name="${esc(a.name)}" data-pkg="${esc(a.package_name || "")}" data-tip="Edit app">${ICON.pencil}</button><button class="btn ghost sm" data-act="rotate" data-id="${a.id}" data-tip="Rotate key">${ICON.refresh}</button><button class="btn ghost sm" data-act="icon" data-id="${a.id}" data-tip="Fetch icon">${ICON.image}</button><button class="btn ghost sm" data-act="snippet" data-id="${a.id}" data-tip="Tracking code">${ICON.code}</button><button class="btn danger sm" data-act="del" data-id="${a.id}" data-name="${esc(a.name)}" data-tip="Delete app">${ICON.trash}</button></div></td></tr>`).join("")
          : '<tr class="no-apps"><td colspan="4" class="muted" style="text-align:center;padding:28px">No apps yet &mdash; add one above to get started.</td></tr>'}<tr id="tb-nomatch" style="display:none"><td colspan="4" class="muted" style="text-align:center;padding:28px">No apps match your search.</td></tr></tbody></table></div></div>`;

      $("#af").onsubmit = async (e) => {
        e.preventDefault();
        const form = e.target;
        const pkg = (form.package_name.value || "").trim();
        try {
          const r = await api("/api/apps", { method: "POST", body: Object.fromEntries(new FormData(form)) });
          await viewApps();
          const iconMissing = pkg && !r.icon_url;
          showSnippetModal(r, iconMissing ? () => setTimeout(() => uiAlert("App created, but this package name was not found on the Play Store or App Store - no icon was fetched. Check the package name and use the 'Edit' or 'Icon' button.", { title: "Icon not found", type: "warn" }), 150) : null);
        }
        catch (er) { uiError(er.message); }
      };
      const qEl = $("#app-q");
      const filterAppRows = () => {
        const q = (qEl.value || "").trim().toLowerCase();
        const rows = $$("#tb tr[data-s]");
        let vis = 0;
        rows.forEach((tr) => {
          const hit = !q || tr.dataset.s.includes(q);
          tr.style.display = hit ? "" : "none";
          if (hit) vis++;
        });
        const nomatch = $("#tb-nomatch");
        if (nomatch) nomatch.style.display = rows.length && !vis ? "" : "none";
        const cnt = $("#applist-cnt");
        if (cnt) cnt.textContent = q ? `${vis} of ${rows.length} ${rows.length === 1 ? "app" : "apps"}` : `${rows.length} ${rows.length === 1 ? "app" : "apps"}`;
      };
      if (qEl) qEl.oninput = (e) => { state.appsSearch = e.target.value; filterAppRows(); };
      filterAppRows();
      $("#tb").onclick = async (e) => {
        const keyEl = e.target.closest(".key");
        if (keyEl) {
          try { await navigator.clipboard.writeText(keyEl.dataset.key); keyEl.classList.add("copied"); setTimeout(() => keyEl.classList.remove("copied"), 1200); } catch { uiAlert(keyEl.dataset.key, { title: "API key (copy failed)" }); }
          return;
        }
        const b = e.target.closest("button[data-act]"); if (!b) return;
        const id = b.dataset.id, keyCell = b.closest("tr").querySelector(".key");
        if (b.dataset.act === "show") {
          const open = keyCell.textContent.includes("\u2022");
          keyCell.textContent = open ? keyCell.dataset.key : keyCell.dataset.key.slice(0, 7) + "\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022";
          b.dataset.tip = open ? "Hide key" : "Show key";
          b.classList.toggle("on", open);
        } else if (b.dataset.act === "edit") {
          editApp(id);
        } else if (b.dataset.act === "rotate") {
          if (!(await uiConfirm("A new key will be created. The old key stops working immediately. Continue?", { title: "Rotate API key?", type: "warn", confirmText: "Rotate" }))) return;
          await api(`/api/apps/${id}/rotate-key`, { method: "POST" }); viewApps();
        } else if (b.dataset.act === "icon") {
          b.style.opacity = ".5"; b.style.pointerEvents = "none";
          try {
            const r = await api(`/api/apps/${id}/icon`, { method: "POST" });
            viewApps();
            if (!r.found) uiAlert("This package name was not found on the Play Store or App Store - no icon was fetched. Use 'Edit' to fix the package name.", { title: "Icon not found", type: "warn" });
          } catch (er) { uiError(er.message); viewApps(); }
        } else if (b.dataset.act === "snippet") {
          const a = state.apps.find((x) => String(x.id) === String(id));
          if (a) showSnippetModal(a);
        } else if (b.dataset.act === "del") {
          if (!(await uiConfirm(`Delete "${b.dataset.name}" and all of its install data? This cannot be undone.`, { title: "Delete app?", type: "danger", confirmText: "Delete" }))) return;
          await api(`/api/apps/${id}`, { method: "DELETE" }); viewApps();
        }
      };
    }

    /* ---------- snippet modal ---------- */
    function showSnippetModal(app, onClose) {
      const host = location.origin;
      const snips = SNIPPETS(host, app.package_name || "com.example.app", app.api_key);
      const names = Object.keys(snips);
      let tab = names[0];
      modal(`<h3 style="display:flex;align-items:center;gap:10px;margin:0 0 14px">${ICON.code} Tracking code &mdash; ${esc(app.name)}</h3>
    <div class="snip-tabs" id="mtabs">${names.map((n) => `<button data-n="${n}" class="${n === tab ? "on" : ""}">${n}</button>`).join("")}</div>
    <div class="snip-body" style="margin-top:12px"><button type="button" class="snip-copy" id="mcp">${ICON.copy}<span>Copy</span></button><pre id="msnip">${esc(snips[tab])}</pre></div>
    <div class="add-note" style="margin-top:14px">${ICON.info}<div>Send <code>device_id</code> (only required field). <code>country</code> and <code>installed_at</code> are auto-filled server-side. Repeated calls from the same device bump <b>install count</b> &mdash; no duplicates.</div></div>
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn ghost" data-close>Close</button></div>`, (d) => {
        d.classList.add("wide");
        d.addEventListener("close", () => { d.classList.remove("wide"); if (onClose) onClose(); }, { once: true });
        const paint = () => {
          $("#msnip", d).textContent = snips[tab];
          $$("#mtabs button", d).forEach((b) => b.classList.toggle("on", b.dataset.n === tab));
        };
        $$("#mtabs button", d).forEach((b) => (b.onclick = () => { tab = b.dataset.n; paint(); }));
        $("#mcp", d).onclick = async () => {
          const btn = $("#mcp", d);
          try {
            await navigator.clipboard.writeText(snips[tab]);
            btn.classList.add("ok");
            btn.querySelector("span").textContent = "Copied";
            setTimeout(() => { btn.classList.remove("ok"); btn.querySelector("span").textContent = "Copy"; }, 1400);
          } catch { uiAlert(snips[tab], { title: "Snippet (copy failed)" }); }
        };
      });
    }

    /* ---------- view: users (admin) ---------- */
    async function viewUsers() {
      const m = $("#main");
      const [{ users }, { apps }] = await Promise.all([api("/api/users"), api("/api/apps")]);
      apps.sort((a, b) => b.id - a.id); // newest added first (matches the app picker popup order)
      state.apps = apps;
      const appName = Object.fromEntries(apps.map((a) => [a.id, a.name]));
      const checks = (sel = []) => apps.length
        ? apps.map((a) => `<label class="ck" data-s="${esc((((a.name || "") + " " + (a.package_name || "")).toLowerCase()))}">${appIcon(a, true)}<span class="ck-meta"><span class="ck-n">${esc(a.name)}</span><span class="ck-p">${esc(a.package_name || "")}</span></span><input type="checkbox" value="${a.id}" ${sel.includes(a.id) ? "checked" : ""}></label>`).join("")
        : '<span class="muted">Add an app first</span>';
      const picked = (el) => [...el.querySelectorAll("input[type=checkbox]:checked")].map((c) => Number(c.value));
      const openAccessModal = (o) => {
        modal(`<h3 style="display:flex;align-items:center;gap:10px;margin:0 0 4px">${ICON.users} ${esc(o.title)}</h3>
    <p class="sub" style="margin:0 0 12px">${o.subtitle}</p>
    <label class="appsearch">${ICON.search}<input id="ua-q" type="search" placeholder="Search apps\u2026" autocomplete="off"></label>
    <div class="checks cols" id="ua-c" style="margin-top:12px">${o.checksHtml}</div>
    ${o.withPassword ? `<div style="margin-top:12px"><div class="muted" style="margin-bottom:6px">New password</div><input id="ua-p" type="password" placeholder="Leave blank to keep current" autocomplete="new-password" style="width:100%"></div>` : ""}
    <div class="msg" id="ua-m"></div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" id="ua-ok">${esc(o.submitLabel)}</button></div>`, (d) => {
          d.classList.add("wide");
          d.addEventListener("close", () => d.classList.remove("wide"), { once: true });
          const q = $("#ua-q", d);
          q.oninput = () => { const v = (q.value || "").trim().toLowerCase(); $$("#ua-c .ck", d).forEach((l) => { l.style.display = !v || (l.dataset.s || "").includes(v) ? "" : "none"; }); };
          $("#ua-ok", d).onclick = async () => {
            const btn = $("#ua-ok", d); btn.disabled = true;
            try { await o.onOk(picked($("#ua-c", d)), o.withPassword ? $("#ua-p", d).value : undefined); d.close(); }
            catch (er) { $("#ua-m", d).textContent = er.message; btn.disabled = false; }
          };
        });
      };

      m.innerHTML = `<div class="sec">
    <div class="sec-hd"><div class="ico">${ICON.plus}</div>
      <div class="tt"><h2>Create sub user</h2><p class="sub">A sub user signs in with these credentials and can only see the apps you allow.</p></div></div>
    <form id="uf" class="add-form">
      <div class="field"><label for="uf-name">Username</label><input id="uf-name" name="username" placeholder="e.g. analyst" required maxlength="32" autocomplete="off"></div>
      <div class="field"><label for="uf-pass">Password</label><input id="uf-pass" name="password" type="password" placeholder="Min 8 characters" required autocomplete="new-password"></div>
      <div class="submit"><button class="btn" type="submit">${ICON.plus}<span>Create user</span></button></div></form>
    <div class="add-note">${ICON.info}<div>After you click <b>Create user</b>, a popup lets you pick which apps this user can access &mdash; with a search box to find them fast.</div></div></div>

  <div class="sec">
    <div class="sec-hd"><div class="ico">${ICON.users}</div>
      <div class="tt"><h2>Users</h2><p class="sub">Manage who can sign in and what each sub user is allowed to see.</p></div>
      <label class="appsearch">${ICON.search}<input id="user-q" type="search" placeholder="Search by username\u2026" autocomplete="off" value="${esc(state.usersSearch || "")}"></label>
      <span class="cnt" id="users-cnt">${users.length} ${users.length === 1 ? "user" : "users"}</span></div>
    <div class="tablewrap"><table class="applist users-tb"><thead><tr><th>User</th><th>Role</th><th>Apps with access</th><th></th></tr></thead><tbody id="ut">
    ${users.map((u) => { const _s = (u.username || "").toLowerCase(); return `<tr data-s="${esc(_s)}">
      <td><div class="app-cell"><div class="uav">${esc((u.username || "?").trim().charAt(0).toUpperCase())}</div><div style="min-width:0;flex:1"><div class="an">${esc(u.username)}</div></div></div></td>
      <td>${u.role === "admin" ? '<span class="role admin">Main admin</span>' : '<span class="role sub">Sub user</span>'}</td>
      <td class="uapps-cell">${u.role === "admin" ? '<span class="muted">All apps</span>' : !u.app_ids.length ? '<span class="muted">None</span>' : (() => { const MAX = 6; const names = u.app_ids.map((i) => appName[i] || "?"); const chip = (n) => `<span class="chip">${esc(n)}</span>`; if (names.length <= MAX) return names.map(chip).join(""); const rest = names.slice(MAX); return names.slice(0, MAX).map(chip).join("") + `<span class="chip" title="${esc(rest.join(", "))}">+${rest.length} more \u2014 view in Edit</span>`; })()}</td>
      <td><div class="act">${u.role === "admin" ? "" : `<button class="btn ghost sm" data-act="edit" data-id="${u.id}" data-tip="Edit access">${ICON.pencil}</button><button class="btn danger sm" data-act="del" data-id="${u.id}" data-name="${esc(u.username)}" data-tip="Delete user">${ICON.trash}</button>`}</div></td></tr>`; }).join("")}
    <tr id="ut-nomatch" style="display:none"><td colspan="4"><div class="empty">No users match your search.</div></td></tr></tbody></table></div></div>`;

      $("#uf").onsubmit = (e) => {
        e.preventDefault();
        const fd = Object.fromEntries(new FormData(e.target));
        openAccessModal({
          title: "Create sub user",
          subtitle: `Choose which apps <b>${esc(fd.username)}</b> can access. You can change this later from Edit.`,
          submitLabel: "Create user",
          checksHtml: checks(),
          onOk: async (ids) => { await api("/api/users", { method: "POST", body: { username: fd.username, password: fd.password, app_ids: ids } }); viewUsers(); }
        });
      };
      $("#ut").onclick = async (e) => {
        const b = e.target.closest("button[data-act]"); if (!b) return;
        const u = users.find((x) => x.id === Number(b.dataset.id));
        if (b.dataset.act === "del") {
          if (!(await uiConfirm(`Delete user "${b.dataset.name}"?`, { title: "Delete user?", type: "danger", confirmText: "Delete" }))) return;
          await api(`/api/users/${u.id}`, { method: "DELETE" }); viewUsers();
        } else {
          openAccessModal({
            title: `Edit ${u.username}`,
            subtitle: "Update which apps this user can see, or set a new password.",
            submitLabel: "Save",
            checksHtml: checks(u.app_ids),
            withPassword: true,
            onOk: async (ids, password) => { await api(`/api/users/${u.id}`, { method: "PUT", body: { app_ids: ids, password } }); viewUsers(); }
          });
        }
      };
      const uq = $("#user-q");
      const filterUserRows = () => {
        const q = (uq.value || "").trim().toLowerCase();
        const rows = $$("#ut tr[data-s]");
        let vis = 0;
        rows.forEach((tr) => { const hit = !q || tr.dataset.s.includes(q); tr.style.display = hit ? "" : "none"; if (hit) vis++; });
        const nomatch = $("#ut-nomatch");
        if (nomatch) nomatch.style.display = rows.length && !vis ? "" : "none";
        const cnt = $("#users-cnt");
        if (cnt) cnt.textContent = q ? `${vis} of ${rows.length} ${rows.length === 1 ? "user" : "users"}` : `${rows.length} ${rows.length === 1 ? "user" : "users"}`;
      };
      if (uq) uq.oninput = (e) => { state.usersSearch = e.target.value; filterUserRows(); };
      filterUserRows();
    }

    boot();
  </script>
</body>

</html>
